<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecondSelf — Knowledge Graph Visualization</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #network-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Floating Header & Overlay Controls */
    .overlay-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 18px 22px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 360px;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 0.825rem;
      color: #94a3b8;
      margin-top: 4px;
      margin-bottom: 14px;
    }
    .stats-row {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      font-size: 0.85rem;
    }
    .stat-badge {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .stat-value {
      font-weight: 700;
      color: #38bdf8;
    }

    /* Legend */
    .legend-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
    }
    .legend-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.8rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-projects { background-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
    .dot-areas { background-color: #3b82f6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }
    .dot-resources { background-color: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
    .dot-archives { background-color: #6b7280; box-shadow: 0 0 8px rgba(107, 114, 128, 0.5); }

    /* Control Buttons */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }
    .btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-2px);
    }

    /* Custom Tooltip */
    #tooltip {
      position: absolute;
      z-index: 20;
      display: none;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 14px 18px;
      max-width: 320px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .tt-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .tt-para {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .tt-para.Projects { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .tt-para.Areas { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .tt-para.Resources { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .tt-para.Archives { background: rgba(107, 114, 128, 0.2); color: #d1d5db; }
    .tt-summary {
      font-size: 0.8rem;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .tt-excerpt {
      font-size: 0.75rem;
      color: #94a3b8;
      font-style: italic;
      line-height: 1.3;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 6px;
    }
  </style>
</head>
<body>
  <div id="network-container"></div>

  <!-- Header Overlay -->
  <div class="overlay-panel">
    <div class="title">
      <span>🧠 SecondSelf Graph</span>
    </div>
    <div class="subtitle">Interactive force-directed brain visualization</div>

    <div class="stats-row">
      <div class="stat-badge">Notes: <span id="stat-nodes" class="stat-value">0</span></div>
      <div class="stat-badge">Links: <span id="stat-edges" class="stat-value">0</span></div>
    </div>

    <div class="legend-title">PARA Categories</div>
    <div class="legend-grid">
      <div class="legend-item"><span class="dot dot-projects"></span> Projects</div>
      <div class="legend-item"><span class="dot dot-areas"></span> Areas</div>
      <div class="legend-item"><span class="dot dot-resources"></span> Resources</div>
      <div class="legend-item"><span class="dot dot-archives"></span> Archives</div>
    </div>
  </div>

  <!-- Floating Controls -->
  <div class="controls-panel">
    <button class="btn" id="btn-fit">🔍 Fit View</button>
    <button class="btn" id="btn-physics">⚡ Toggle Physics</button>
  </div>

  <!-- Hover Tooltip -->
  <div id="tooltip">
    <div id="tt-title" class="tt-title"></div>
    <span id="tt-para" class="tt-para"></span>
    <div id="tt-summary" class="tt-summary"></div>
    <div id="tt-excerpt" class="tt-excerpt"></div>
  </div>

  <script>
    const PARA_COLORS = {
      Projects: { background: '#ef4444', border: '#b91c1c', highlight: '#fca5a5' },
      Areas:    { background: '#3b82f6', border: '#1d4ed8', highlight: '#93c5fd' },
      Resources:{ background: '#10b981', border: '#047857', highlight: '#6ee7b7' },
      Archives: { background: '#6b7280', border: '#374151', highlight: '#d1d5db' }
    };

    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttPara  = document.getElementById('tt-para');
    const ttSummary = document.getElementById('tt-summary');
    const ttExcerpt = document.getElementById('tt-excerpt');

    let network = null;
    let physicsEnabled = true;

    async function loadGraphData() {
      // 1. Check if graph data was injected directly by host application (e.g. Streamlit)
      if (window.EMBEDDED_GRAPH_DATA && window.EMBEDDED_GRAPH_DATA.nodes) {
        renderNetwork(window.EMBEDDED_GRAPH_DATA);
        return;
      }

      const paths = ['../data/graph.json', '../graph.json', 'graph.json'];
      let data = null;

      for (const p of paths) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            data = await res.json();
            break;
          }
        } catch (e) {
          // try next
        }
      }

      if (!data) {
        document.getElementById('network-container').innerHTML = `
          <div style="padding: 40px; max-width: 600px; margin: 50px auto; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 16px; color: #f8fafc; font-family: sans-serif;">
            <h2 style="color: #ef4444; margin-bottom: 12px; font-size: 1.25rem;">⚠️ Cannot fetch graph.json via file:// protocol</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; line-height: 1.5; margin-bottom: 16px;">
              Modern web browsers block <code>fetch()</code> requests when opening HTML files directly from disk (<code>file://</code> scheme) due to security policies.
            </p>

            <div style="background: rgba(30, 41, 59, 0.8); padding: 14px 18px; border-radius: 10px; margin-bottom: 20px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1);">
              <strong style="color: #38bdf8;">Option 1: Run Local Server (Recommended)</strong>
              <pre style="background: #090d16; color: #38bdf8; padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 0.85rem;">python3 -m http.server 8000</pre>
              <p style="margin-top: 8px; color: #cbd5e1;">Then open: <a href="http://localhost:8000/static/graph.html" style="color: #38bdf8; font-weight: 600;">http://localhost:8000/static/graph.html</a></p>
            </div>

            <div style="background: rgba(30, 41, 59, 0.8); padding: 14px 18px; border-radius: 10px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.1);">
              <strong style="color: #10b981;">Option 2: Select graph.json Manually</strong>
              <p style="margin-top: 6px; margin-bottom: 10px; color: #cbd5e1;">Choose your <code>data/graph.json</code> file directly:</p>
              <input type="file" id="manual-graph-file" accept=".json" style="background: #1e293b; color: #fff; padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); cursor: pointer;" />
            </div>
          </div>
        `;

        document.getElementById('manual-graph-file')?.addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(evt) {
            try {
              const loadedData = JSON.parse(evt.target.result);
              document.getElementById('network-container').innerHTML = '';
              renderNetwork(loadedData);
            } catch (err) {
              alert('Invalid JSON file format.');
            }
          };
          reader.readAsText(file);
        });
        return;
      }

      renderNetwork(data);
    }

    function renderNetwork(data) {
      document.getElementById('stat-nodes').textContent = data.meta?.note_count || data.nodes.length;
      document.getElementById('stat-edges').textContent = data.meta?.edge_count || data.edges.length;

      // Transform nodes for vis-network
      const visNodes = data.nodes.map(n => {
        const colors = PARA_COLORS[n.para] || PARA_COLORS.Resources;
        return {
          id: n.id,
          label: n.label || n.id,
          shape: 'dot',
          size: 16,
          color: {
            background: colors.background,
            border: colors.border,
            highlight: { background: colors.highlight, border: '#ffffff' }
          },
          font: { color: '#f8fafc', face: 'Inter', size: 12 },
          rawNode: n
        };
      });

      // Transform edges for vis-network
      const visEdges = data.edges.map(e => ({
        from: e.source,
        to: e.target,
        color: { color: e.type === 'explicit_link' ? '#38bdf8' : 'rgba(148, 163, 184, 0.3)', highlight: '#38bdf8' },
        width: e.type === 'explicit_link' ? 2 : 1,
        dashes: e.type !== 'explicit_link'
      }));

      const container = document.getElementById('network-container');
      const networkData = { nodes: new vis.DataSet(visNodes), edges: new vis.DataSet(visEdges) };

      const options = {
        physics: {
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: -50,
            centralGravity: 0.01,
            springLength: 100,
            springConstant: 0.08
          },
          stabilization: { iterations: 150 }
        },
        interaction: {
          hover: true,
          tooltipDelay: 50,
          zoomView: true,
          dragView: true
        }
      };

      network = new vis.Network(container, networkData, options);

      // Tooltip handling on hover
      network.on('hoverNode', function (params) {
        const nodeObj = visNodes.find(n => n.id === params.node);
        if (!nodeObj) return;

        const raw = nodeObj.rawNode;
        ttTitle.textContent = raw.label || raw.id;
        ttPara.textContent = raw.para || 'Resources';
        ttPara.className = 'tt-para ' + (raw.para || 'Resources');
        ttSummary.textContent = raw.summary || 'No summary available.';
        ttExcerpt.textContent = raw.excerpt ? `"${raw.excerpt}"` : '';

        tooltip.style.display = 'block';
        tooltip.style.left = (params.event.clientX + 15) + 'px';
        tooltip.style.top = (params.event.clientY + 15) + 'px';
      });

      network.on('blurNode', function () {
        tooltip.style.display = 'none';
      });

      // Move tooltip with mouse
      container.addEventListener('mousemove', function (e) {
        if (tooltip.style.display === 'block') {
          tooltip.style.left = (e.clientX + 15) + 'px';
          tooltip.style.top = (e.clientY + 15) + 'px';
        }
      });
    }

    document.getElementById('btn-fit').addEventListener('click', () => {
      if (network) network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
    });

    document.getElementById('btn-physics').addEventListener('click', () => {
      if (network) {
        physicsEnabled = !physicsEnabled;
        network.setOptions({ physics: { enabled: physicsEnabled } });
      }
    });

    window.addEventListener('DOMContentLoaded', loadGraphData);
  </script>
</body>
</html>
